<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_33 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_33" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_33');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xd4af37, 2, 10);
pointLight.position.set(2, 3, 4);
scene.add(pointLight);

const blueLight = new THREE.PointLight(0x4169e1, 1, 10);
blueLight.position.set(-2, -3, 2);
scene.add(blueLight);

// Create a Gemstone (using Octahedron for a classic diamond cut)
const geometry = new THREE.OctahedronGeometry(1.5, 1); // 1 detail for faceted look
const material = new THREE.MeshPhongMaterial({
    color: 0xffffff,
    specular: 0xffffff,
    shininess: 100,
    transparent: true,
    opacity: 0.8,
    flatShading: true,
    side: THREE.DoubleSide
});

const gem = new THREE.Mesh(geometry, material);
scene.add(gem);

// Wireframe overlay for precision feel
const wireframeGeom = new THREE.OctahedronGeometry(1.51, 1);
const wireframeMat = new THREE.MeshBasicMaterial({ color: 0xd4af37, wireframe: true, transparent: true, opacity: 0.2 });
const wireframe = new THREE.Mesh(wireframeGeom, wireframeMat);
gem.add(wireframe);

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
let targetRotationX = 0;
let targetRotationY = 0;

const onMouseMove = (event) => {
    mouseX = (event.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
};

window.addEventListener('mousemove', onMouseMove);

const animate = () => {
    requestAnimationFrame(animate);
    
    // Smooth rotation
    targetRotationY = mouseX * 0.5;
    targetRotationX = mouseY * 0.5;
    
    gem.rotation.y += (targetRotationY - gem.rotation.y) * 0.05;
    gem.rotation.x += (targetRotationX - gem.rotation.x) * 0.05;
    
    // Ambient slow rotation
    gem.rotation.y += 0.005;
    
    // Subtle pulsing
    const scale = 1 + Math.sin(Date.now() * 0.001) * 0.05;
    gem.scale.set(scale, scale, scale);
    
    renderer.render(scene, camera);
};

animate();

const handleResize = () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
};

window.addEventListener('resize', handleResize);
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_33 -->
</body>
</html>
