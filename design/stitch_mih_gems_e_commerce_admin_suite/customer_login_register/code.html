<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden cinematic-glow">

<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-30" data-alt="A macro, cinematic photograph of a raw, uncut diamond nestled in dark, porous volcanic rock. The lighting is dramatic and moody, with a single, sharp spotlight catching the facets of the gem, creating brilliant, sharp reflections in stark contrast to the deep black shadows. The overall atmosphere is luxurious, mysterious, and evokes a sense of discovery and high-end exclusivity. The color palette is dominated by deep charcoal blacks and brilliant, cold white highlights." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqKTlsB59H3XNR4rqM30ppaHWVQ_1od4htGodGiAbqRaWeFQrJwFNHUVdWeeQ-hlddg2zusEDX9VbhQvodCAd_vcDXi_8B4KJ4OgrgDqKyFGBnqUv3KFUFx7BtvuR3BNQJiFYnWLLZ7EXWMEBHu6puIauUHlkvPrhApMw7h7TuJkcmTr0gV3mqfIPJOPQGqtIn8E1sdlRyoRKWwYYRSsF6It139StwuXHa6KpmfaN0XqrkFpM8h8jS')"></div>

</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[500px] px-margin-mobile md:px-0">
<!-- Logo -->
<div class="text-center mb-12">
<h1 class="font-headline-lg text-headline-lg text-secondary tracking-widest uppercase">MIH GEMS</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-2 tracking-[0.2em] uppercase">Authentication</p>
</div>
<!-- Auth Card -->
<div class="smoked-glass border border-secondary/30 rounded-DEFAULT p-8 md:p-12 relative shadow-2xl">
<!-- Subtle border glow effect -->
<div class="absolute inset-0 border border-secondary/10 rounded-DEFAULT pointer-events-none transition-all duration-500 group-hover:border-secondary/30"></div>
<!-- Tabs -->
<div class="flex border-b border-secondary/20 mb-8">
<button aria-selected="true" class="flex-1 pb-4 text-center font-label-md text-label-md text-secondary border-b-2 border-secondary transition-colors uppercase">
                    Login
                </button>
<button aria-selected="false" class="flex-1 pb-4 text-center font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors uppercase">
                    Register
                </button>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6">
<div class="flex flex-col relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-2 transition-colors group-focus-within:text-secondary uppercase" for="email">Email Address</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:ring-0 focus:border-secondary text-on-surface font-body-md text-body-md px-0 py-2 transition-colors placeholder:text-outline-variant/50" id="email" placeholder="collector@example.com" required="" type="email"/>
</div>
<div class="flex flex-col relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-2 transition-colors group-focus-within:text-secondary uppercase" for="password">Password</label>
<input class="bg-transparent border-0 border-b border-outline-variant focus:ring-0 focus:border-secondary text-on-surface font-body-md text-body-md px-0 py-2 transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex justify-between items-center mt-2">
<label class="flex items-center gap-2 cursor-pointer">
<input class="form-checkbox bg-transparent border-outline-variant text-secondary focus:ring-secondary/50 rounded-sm" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Remember Me</span>
</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-secondary-fixed transition-colors underline-offset-4 hover:underline uppercase" href="#">Forgot Password?</a>
</div>
<button class="mt-8 bg-secondary text-on-secondary font-label-md text-label-md py-4 rounded-none hover:bg-secondary-fixed transition-all duration-300 uppercase tracking-widest relative overflow-hidden group" type="submit">
<span class="relative z-10">Sign In</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</form>
<div class="mt-8 text-center border-t border-secondary/10 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Or continue with</p>
<div class="flex justify-center gap-4">
<button class="p-3 border border-secondary/30 rounded-DEFAULT hover:border-secondary text-secondary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mail</span>
</button>
</div>
</div>
</div>
