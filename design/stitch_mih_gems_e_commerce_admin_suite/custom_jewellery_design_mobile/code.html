<style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0A0A0A; color: #e4e3d7; }
        h1, h2, h3, h4, h5, h6, .font-playfair { font-family: 'Playfair Display', serif; }
        
        /* Custom Input Styling */
        .glass-input {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid #34352e; /* outline-variant */
            color: #e4e3d7;
            border-radius: 0;
            padding: 12px 0;
            transition: border-color 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            box-shadow: none;
            border-bottom-color: #e9c349; /* secondary */
        }
        .glass-input::placeholder {
            color: #8e9192; /* outline */
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Smoked Glass Header */
        .smoked-header {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(233, 195, 73, 0.3);
        }

        /* Button Glow */
        .btn-glow {
            position: relative;
            overflow: hidden;
        }
        .btn-glow::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.4) 0%, transparent 60%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }
        .btn-glow:active::after {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            transition: transform 0s, opacity 0s;
        }
        .btn-content { position: relative; z-index: 2; }

    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<!-- Suppressed Top Nav & Bottom Nav as this is a transactional flow (Enquiry Form) -->
<!-- Mobile Header -->
<header class="smoked-header w-full sticky top-0 z-50 flex items-center justify-between px-margin-mobile py-4">
<button aria-label="Go back" class="text-on-surface hover:text-secondary transition-colors p-2 -ml-2">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>

<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-8 pb-32">
<!-- Progress Indicator -->
<div class="flex items-center justify-between mb-8 w-full max-w-sm mx-auto px-4">
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center font-bold text-sm shadow-[0_0_10px_rgba(212,175,55,0.3)]">1</div>
<span class="text-[10px] uppercase font-label-sm text-secondary mt-2 text-center tracking-widest">Foundation</span>
</div>
<div class="flex-grow h-[1px] bg-secondary/30 mx-2"></div>
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full border border-secondary text-secondary flex items-center justify-center font-bold text-sm bg-surface-container-low">2</div>
<span class="text-[10px] uppercase font-label-sm text-on-surface-variant mt-2 text-center tracking-widest">Details</span>
</div>
</div>
<div class="mb-10 text-center">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface mb-2">Design Your Legacy</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Step 1: The Foundation</p>
</div>
<!-- Form Container -->
<div class="w-full max-w-md mx-auto space-y-8 flex-grow">
<!-- Type Selection (Chips) -->
<div class="space-y-4">
<label class="block text-label-sm font-label-sm text-secondary uppercase tracking-widest">Jewellery Type</label>
<div class="grid grid-cols-2 gap-4">
<button class="border border-secondary bg-secondary/10 text-secondary py-3 px-4 text-sm font-label-md uppercase tracking-wider text-center transition-colors">
                        Ring
                    </button>
<button class="border border-surface-variant bg-surface text-on-surface-variant py-3 px-4 text-sm font-label-md uppercase tracking-wider text-center hover:border-secondary/50 transition-colors">
                        Necklace
                    </button>
<button class="border border-surface-variant bg-surface text-on-surface-variant py-3 px-4 text-sm font-label-md uppercase tracking-wider text-center hover:border-secondary/50 transition-colors">
                        Earrings
                    </button>
<button class="border border-surface-variant bg-surface text-on-surface-variant py-3 px-4 text-sm font-label-md uppercase tracking-wider text-center hover:border-secondary/50 transition-colors">
                        Bracelet
                    </button>
</div>
</div>
<!-- Metal Selection -->
<div class="space-y-4">
<label class="block text-label-sm font-label-sm text-secondary uppercase tracking-widest">Precious Metal</label>
<div class="relative">
<select class="w-full glass-input appearance-none bg-transparent cursor-pointer">
<option class="bg-surface text-on-surface-variant" disabled="" selected="" value="">Select Metal</option>
<option class="bg-surface text-on-surface" value="gold_18k">18K Yellow Gold</option>
<option class="bg-surface text-on-surface" value="white_gold">18K White Gold</option>
<option class="bg-surface text-on-surface" value="rose_gold">18K Rose Gold</option>
<option class="bg-surface text-on-surface" value="platinum">Platinum</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Primary Gemstone -->
<div class="space-y-4">
<label class="block text-label-sm font-label-sm text-secondary uppercase tracking-widest">Primary Gemstone Intent</label>
<input class="w-full glass-input" placeholder="E.G., SAPPHIRE, EMERALD, DIAMOND" type="text">
</div>
<!-- Image Upload Area -->
<div class="space-y-4 pt-4">
<label class="block text-label-sm font-label-sm text-secondary uppercase tracking-widest">Inspiration References</label>
<div class="border border-dashed border-surface-variant rounded-none bg-surface-container-lowest p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:border-secondary transition-colors relative group">
<!-- Decorative background element for cinematic feel -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(212,175,55,0.05)_0%,transparent_70%)] opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
<span class="material-symbols-outlined text-4xl text-secondary mb-3">cloud_upload</span>
<p class="text-label-md font-label-md text-on-surface uppercase mb-1">Upload Images</p>
<p class="text-xs font-body-md text-on-surface-variant">Max 3 files, JPG or PNG</p>
</div>
<!-- Placeholder for uploaded thumbnail -->
<div class="flex gap-4 mt-4 hidden" id="upload-preview-area">
<div class="w-16 h-16 border border-surface-variant bg-surface relative overflow-hidden group">
<!-- Example placeholder structure, handled by JS normally -->
<div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-white text-sm">close</span>
</div>
</div>
</div>
</div>
<!-- Additional Notes -->

</div>
</div>
</main>

<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/90 backdrop-blur-md border-t border-secondary/10 z-50 flex justify-center">
